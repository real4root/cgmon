# cgmon — справочный конфиг: все настройки со значениями по умолчанию и пояснениями.
# Используется мастером `cgmon --advanced-install` и как образец /etc/cgmon/cgmon.yaml.
# Пустые/нулевые значения означают «по умолчанию».

# Подробность журнала: info — обычный, debug — подробный (для отладки), error — только ошибки.
log_level: info
# Режим наблюдения: лимитер ничего не блокирует, только пишет, что сделал бы. На странице — галочка «Active» (наоборот).
dry_run: true
# Разрешить динамический лимитер новых соединений (самый агрессивный клиент при деградации WAN).
enable_limiter: true
# Сколько секунд после запуска только наблюдать (диагноз MONITORING_ONLY), не делая выводов.
startup_grace_sec: 300
# Период основного цикла, с: чтение conntrack, статус, журнал. 1 — страница обновляется каждую секунду.
interval_sec: 5
# Как часто TCP-пробы WAN (подключение к probes.ipv4/ipv6), с.
probe_interval_sec: 5
# Как часто UDP-пробы (DNS-запрос к probes.udp_v4/udp_v6), с.
udp_probe_interval_sec: 15
# Таймаут одной пробы, с: не ответили за это время — проба неудачная.
probe_timeout_sec: 3
# Окно статистики проб для состояния WAN, с (доля успешных за это время).
stat_window_sec: 60
# Длинное окно статистики (для отчётов и истории), с.
stat_long_window_sec: 300
# Сколько самых активных клиентов показывать в «top».
status_top_clients: 10
# Сколько секунд устройство держится в таблице «Активные устройства» после последней активности.
client_retention_sec: 86400
# Где хранить промежуточные данные (учёт трафика, платный трафик, метрики по сайтам,
# учитель отдачи, порты, центр сбора, кеш производителей, напоминания об оплате):
#   flash — /etc/cgmon: ничего не пропадает, но встроенная flash роутера изнашивается;
#   tmp   — /tmp/cgmon/data: flash не изнашивается, но после перезагрузки данные удаляются;
#   свой каталог, например /mnt/usb/cgmon (USB-флешка, диск; только /mnt, /media, /opt,
#   /srv, /data) — и flash цела, и данные переживают перезагрузку. Пока носитель не
#   смонтирован, данные пишутся в /tmp/cgmon/data (не во внутреннюю flash), появится — переедут.
# При смене данные копируются в новое место. Настройки (cgmon.yaml, runtime.json), свой
# список бесплатных сетей и состояние DNS-страховки всегда на flash; история графика —
# только в памяти и /tmp.
storage: flash
# Доп. LAN-устройства (обычно пусто — LAN берётся из зон lan_zones). Пример: [br-lan, vlan24]
lan_interfaces: []
# Доп. LAN-сети (обычно пусто — берутся из адресов интерфейсов). Пример: [192.168.2.0/24]
lan_networks: []
# Зоны firewall, клиенты которых мониторятся (их адреса, включая IPv6, подхватываются сами). Пример: [lan, tenants, wifi24]
lan_zones: [lan]
# Выделенные зоны (квартиранты): с этих адресов страница показывает только устройства своего VLAN, без настроек. Пример: [tenants]
isolated_zones: []
# Туннельные сети (tailscale, zerotier): трафик в них не считается внешним. Пример: [100.64.0.0/22]
tunnel_networks: []
# Клиенты, которых лимитер не трогает никогда. Пример: [192.168.1.10, 192.168.1.0/28]
whitelist: []
# Защищённые сети (как whitelist, но сетями). Пример: [192.168.1.0/28]
protected_networks: []
# Сети, которые полностью игнорируются при подсчёте (например VoIP). Пример: [10.64.0.0/11]
exclude_networks: []
# Особые хосты с подписью (ip + name), только в cgmon.yaml. Пример:
#  - ip: 192.168.1.50
#    name: Телевизор
special_hosts: []

# ==== Пробы WAN ====
probes:
  # Цели TCP-проб IPv4 (адрес:порт). Состояние WAN решают пробы — цели должны быть стабильными.
  ipv4: ["1.1.1.1:443", "8.8.8.8:443", "9.9.9.9:443"]
  # Цели TCP-проб IPv6 ([адрес]:порт). Пусто — IPv6 не проверяется.
  ipv6: ["[2606:4700:4700::1111]:443", "[2001:4860:4860::8888]:443"]
  # Цели UDP-проб IPv4 (DNS, порт 53).
  udp_v4: ["1.1.1.1:53", "8.8.8.8:53", "9.9.9.9:53"]
  # Цели UDP-проб IPv6 (DNS).
  udp_v6: ["[2606:4700:4700::1111]:53", "[2001:4860:4860::8888]:53"]

# ==== Пороги состояния WAN ====
thresholds:
  # Успешных проб IPv4 меньше этого % дольше enter_duration_sec — WARNING.
  warning_enter_success: 95
  # Успешных меньше этого % — CRITICAL.
  critical_enter_success: 80
  # Выше этого % дольше recovery_duration_sec — RECOVERY/NORMAL.
  recovery_success: 98
  # Сколько держаться плохому, чтобы перейти в WARNING/CRITICAL, с.
  enter_duration_sec: 30
  # Сколько держаться хорошему, чтобы считать восстановление, с.
  recovery_duration_sec: 300
  # IPv6 считается здоровым (контрольный канал) при успехе выше этого %.
  ipv6_healthy_success: 98

# ==== Лимитер новых соединений ====
limits:
  # Режим лимита новых соединений: adaptive — от текущего числа соединений клиента; static — фиксированные warning/critical.
  mode: adaptive
  # Лимит в NORMAL (0 — без лимита).
  normal: 0
  # Лимит соединений клиента в WARNING (static) или нижняя граница (adaptive).
  warning: 1000
  # Лимит в CRITICAL.
  critical: 500
  # Минимальный лимит (ниже не опускать).
  min: 100
  # Максимальный лимит.
  max: 100000
  # В режиме adaptive лимит в WARNING = текущие соединения × это.
  warning_factor: 0.8
  # В режиме adaptive лимит в CRITICAL = текущие соединения × это.
  critical_factor: 0.6
  # Шаг ослабления лимита при восстановлении, %.
  recovery_step_percent: 10
  # Не менять лимит чаще, с.
  min_change_interval_sec: 60
  # Не трогать клиента, у которого соединений меньше.
  min_offender_connections: 100
  # Снимать блок, когда соединений меньше этого % от лимита.
  block_hysteresis_percent: 90

# ==== Нагрузка роутера (local pressure) ====
local:
  # Нагрузка CPU роутера выше — «local pressure» (проблема в роутере, не в WAN).
  cpu_threshold_percent: 90
  # Заполнение таблицы conntrack выше этого % — local pressure.
  conntrack_threshold_percent: 90
  # Load average на ядро выше — local pressure.
  load_per_core: 1.5
  # Свободной памяти меньше, МБ — local pressure.
  min_memory_mb: 16
  # Загрузка любого ядра выше этого % (0 — не проверять).
  core_threshold_percent: 0
  # Сколько держаться нагрузке, чтобы считать local pressure, с.
  pressure_duration_sec: 15

# ==== nftables лимитера ====
nft:
  # Таблица nftables лимитера (inet).
  table: cgmon
  # Сколько держится блок клиента в наборе, с.
  set_timeout_sec: 60
  # Как часто обновлять правила лимитера, с.
  refresh_sec: 30

# ==== Файлы и сокет ====
paths:
  # Unix-сокет для команд cgmon status/top/...
  socket: /var/run/cgmon.sock
  # Файл статуса (JSON) для страницы.
  status_file: /var/run/cgmon.status.json
  # Метрики (JSONL).
  metrics_file: /tmp/cgmon/metrics.jsonl
  # Настройки, изменённые со страницы (поверх этого файла).
  runtime: /etc/cgmon/runtime.json

# ==== Симуляция (для тестов) ====
simulation:
  # Режим симуляции (тесты без реального WAN). На роутере — false.
  enabled: false
  # Симуляция: успех проб IPv4, %.
  ipv4_success: 100
  # Симуляция: успех проб IPv6, %.
  ipv6_success: 100
  # Симуляция: IP «агрессивного» клиента.
  top_host: ""
  # Симуляция: его соединения.
  top_connections: 0

# ==== WAN ====
wan:
  # Возможные WAN-устройства (дополнение к автоопределению).
  interfaces: [pppoe-wan, wan, eth0.2]
  # Считать WAN устройство маршрута по умолчанию.
  auto_detect_default_route: true
  # Учитывать собственные соединения роутера.
  collect_router_own_traffic: true

# ==== Подсчёт соединений ====
counting:
  # Что считать соединениями клиента: lan_to_wan — только в интернет; lan_only — внутри LAN; all — всё.
  mode: lan_to_wan

# ==== Обратный DNS ====
dns:
  # Обратный DNS для внешних адресов в отчётах (медленнее).
  resolve: false
  # Таймаут обратного DNS, мс.
  timeout_ms: 500
  # Кэш обратного DNS, с.
  cache_ttl_sec: 600
  # Статические имена IP → имя, только в cgmon.yaml. Пример:
  #  192.168.1.50: tv
  static: {}

# ==== Жёсткие лимиты соединений ====
hard_limit:
  # Жёсткие лимиты соединений на хост (статические, таблица torrent_limit).
  enabled: false
  # Жёсткие лимиты — только наблюдать.
  dry_run: true
  # Подхватить настройки старого UCI-блока, если есть.
  uci_import: true
  # Таблица nftables жёстких лимитов.
  table: torrent_limit
  # Для каких интерфейсов/зон.
  interfaces: [lan]
  # Лимитировать транзит IPv4 TCP.
  forward_ipv4_tcp: false
  # Лимитировать транзит IPv4 UDP.
  forward_ipv4_udp: false
  # Лимитировать транзит IPv6 TCP.
  forward_ipv6_tcp: false
  # Лимитировать транзит IPv6 UDP.
  forward_ipv6_udp: false
  # Лимит транзитных соединений на клиента.
  connlimit: 25
  # Лимитировать соединения к самому роутеру IPv4 TCP.
  host_ipv4_tcp: false
  # … IPv4 UDP.
  host_ipv4_udp: false
  # … IPv6 TCP.
  host_ipv6_tcp: false
  # … IPv6 UDP.
  host_ipv6_udp: false
  # Лимит соединений к роутеру на клиента.
  connlimit_host: 50
  # TCP-порты без лимита. Пример: [53, 80, 443]
  except_ports_tcp: [53, 80, 443]
  # UDP-порты без лимита. Пример: [53, 123, 443]
  except_ports_udp: [53, 123, 443]

# ==== Монитор WAN и журнал инцидентов ====
wan_monitor:
  # Следить за WAN (подъём/падение, смена IP и маршрута) и вести журнал инцидентов.
  enabled: true
  # WAN считается упавшим, если не поднялся за столько секунд.
  down_debounce_sec: 15
  # После подъёма WAN столько секунд не делать выводов (переподключения).
  post_up_grace_sec: 120
  # Журнал инцидентов (JSONL).
  incidents_file: /tmp/cgmon/incidents.jsonl

# ==== Выбор шлюза (несколько WAN) ====
gate_selector:
  # Выбор шлюза: проверять несколько WAN и переключать маршрут по умолчанию (требует перезапуска).
  # Шлюзы находятся сами (netifd: маршрут по умолчанию, зона wan); с одним WAN — спит.
  # Переключает только при dry_run: false — по умолчанию лишь наблюдает.
  enabled: true
  # Выбор шлюза — только наблюдать, не переключать.
  dry_run: true
  # Как часто оценивать шлюзы, с.
  evaluation_interval_sec: 1
  # Шлюзы (только в cgmon.yaml). Пример:
  #  - name: wan
  #    device: pppoe-wan
  #    priority: 1
  #    metric: 10
  #  - name: mobile
  #    device: wwan0
  #    priority: 2
  #    metric: 15
  interfaces: []
  # Резервные шлюзы из конструктора путей на странице (переключатель «gate» у пути): true — шлюзы =
  # основной (приоритет 1 из interfaces или автоопределения) + устройства backups по порядку; туннели
  # (tailscale, wg, zt) не берутся.
  from_alternatives: false
  # Устройства резервных шлюзов по приоритету (пишет страница).
  backups: []
  probes:
    # Цели проб шлюзов IPv4.
    ipv4: ["1.1.1.1:443", "8.8.8.8:443"]
    # Цели проб шлюзов IPv6.
    ipv6: ["[2606:4700:4700::1111]:443"]
    # Период проб шлюзов, с.
    interval_sec: 5
    # Окно для оценки шлюза, с.
    decision_window_sec: 30
  thresholds:
    # Оценка выше — шлюз годный (0–100).
    ok_score: 60
    # Оценка ниже — шлюз плохой.
    bad_score: 40
    # Переключаться, если другой лучше на столько очков.
    margin: 25
    # Плохой дольше — переключить, с.
    fail_hold_sec: 20
    # Основной шлюз снова годен при оценке выше.
    failback_score: 80
    # Держаться хорошему столько, чтобы вернуться на основной, с.
    failback_hold_sec: 120
  switching:
    # Возвращаться на основной шлюз, когда он восстановился.
    prefer_primary: true
    # Не переключать чаще, с.
    cooldown_sec: 300
    # Метрика маршрута неактивного шлюза.
    inactive_metric: 98
    # После переключения не делать выводов, с.
    post_switch_grace_sec: 120
    # Записывать метрики в UCI.
    sync_uci_metric: false
    # Команды при переключении (только в cgmon.yaml). Пример: ["/etc/init.d/zerotier restart"]
    on_switch: []
  repair:
    # Перезапускать зависший интерфейс шлюза.
    enabled: true
    # Как перезапускать: ubus (netifd) или ifup.
    method: ubus
    # Интерфейс «завис» в установке дольше, с.
    setup_stuck_sec: 45
    # Поднят без IP дольше, с.
    no_ip_stuck_sec: 30
    # После ремонта ждать, с.
    post_repair_grace_sec: 60
    # Между ремонтами не меньше, с.
    cooldown_sec: 300
    # Ремонтов не больше за окно.
    max_per_window: 4
    # Окно для max_per_window, с.
    window_sec: 1800
    # Начальная пауза между попытками, с.
    backoff_initial_sec: 30
    # Максимальная пауза, с.
    backoff_max_sec: 300
    # Пауза после ошибки авторизации PPPoE, с.
    auth_fail_pause_sec: 60

# ==== Учёт трафика по устройствам ====
accounting:
  # Учёт трафика по устройствам (за час/сутки) — таблица nft inet cgmon_acct (требует перезапуска).
  enabled: true
  # Как часто читать счётчики, с (1 — для графиков на странице).
  refresh_sec: 1
  # Окно скоростей/истории, с.
  window_sec: 3600

# ==== Пиры и WAN-потоки ====
peers:
  # Пиры для проверки путей (только в cgmon.yaml). Пример:
  #  - name: router2
  #    probe: 100.64.0.2:22
  list: []
  # Окно статистики проб пира, с.
  window_sec: 30
  # Ниже этого % — путь к пиру деградировал.
  min_success: 70
  # Сколько держаться, чтобы считать деградацией, с.
  degrade_sec: 10
  # Выше этого % — восстановился.
  recover_success: 90
  # Сколько держаться восстановлению, с.
  recover_sec: 30
  # Задержка выше — тоже деградация (0 — не учитывать).
  max_latency_ms: 250
  # Поток быстрее — «вероятное наказание провайдера».
  penalty_mbps: 45
  # Сколько помнить пики потоков, с.
  peak_window_sec: 300
  # Сколько WAN-потоков показывать в расширенном мониторинге.
  wan_flows_top: 10

# ==== Шейпер отдачи ====
upload_shaper:
  # Шейпер отдачи (обход блокировок p2p у провайдера): первые МБ быстро, потом медленнее.
  enabled: false
  # Устройство отдачи (WAN): auto — то же, что у очереди qos (маршрута по умолчанию), или явно
  device: auto
  # Класс HTB общего лимита.
  class_id: "1:1"
  # Скорость после превышения триггера, кбит/с. Пример: 25000
  sustained_kbit: 0
  # После ступеней — гасить «долг» на этой скорости (0 — нет).
  payback_kbit: 0
  # Ступени (только в cgmon.yaml). Пример:
  #  - kbit: 93000
  #    mb: 40
  stages: []
  # Во сколько раз запас копится медленнее расхода.
  refill_factor: 2
  # Сколько % запаса нужно, чтобы снова разогнаться.
  resume_percent: 20
  # После наказания провайдера — без разгона, с.
  penalty_cooldown_sec: 600
  # Период шейпера, мс.
  interval_ms: 100

# ==== Детектор блокировки P2P ====
flow_watch:
  # Детектор блокировки P2P (+torrent) провайдера по любому трафику.
  enabled: true
  # Поток отдаёт быстрее — проверять его адрес.
  heavy_mbps: 5
  # Отдача упала ниже этого % — «встал».
  stall_percent: 10
  # Сколько стоять, чтобы проверить пробой, с.
  stall_sec: 8
  # Период проб адреса, мс.
  probe_interval_ms: 1000
  # Окно проб для вердикта, с.
  probe_window_sec: 10
  # Потери проб выше — путь плохой.
  loss_percent: 50
  # Медиана задержки ≥ база×factor+add — путь плохой.
  latency_factor: 3
  # Прибавка к порогу задержки, мс.
  latency_add_ms: 100
  # Сколько пробовать после последней быстрой отдачи, с.
  hold_sec: 60
  # Сколько проба должна быть хорошей для «восстановился», с.
  recover_sec: 20
  # Одновременно проверяемых адресов.
  max_targets: 4
  # Без роста задержки путь плохой только при таких потерях проб, %: частичные потери при
  # нормальной задержке — обычно сервер отбрасывает частые подключения (напр. Telegram), а не провайдер.
  loss_only_percent: 80
  # Учитель отдачи: off — выключен; observe — запоминает, на какой скорости к какой сети отдача
  # наказывается, и пишет в журнал, до скольких ограничил бы (сам ничего не ограничивает).
  learn_mode: observe
  # Нижний порог: ограничивать отдачу не ниже этого, кбит/с.
  learn_min_kbit: 3000
  # Файл выученного (переживает перезагрузку).
  learn_file: /etc/cgmon/uplearn.json

# ==== Down detector ====
down_detector:
  # Down detector: какие сайты/сервисы не отвечают клиентам при живом WAN (в журнал).
  enabled: true

path_trace:
  # Поиск виновника: при деградации протокола (пробы <80% дольше 3 мин) роутер раз в 10 мин
  # трассирует TCP 443 до целей проб и метрик по сайтам; если все плохие маршруты идут через
  # один узел/оператора, а хорошие — мимо, это пишется в текущие события и в инциденты.
  enabled: true

# ==== DNS-страховка ====
dns_guard:
  # При сбое у провайдера одного протокола DNS роутера уводит клиентов на живой: IPv6 плохой —
  # клиентам не отдаются IPv6-адреса (AAAA); IPv4 сломан — вышестоящие DNS на время заменяются
  # на DNS64 (сайты только с IPv4 — через NAT64 по IPv6). off | observe (только журнал) | active |
  # targeted (адресный: плохой протокол у сети одного владельца, например IPv6 у Google, — отказ в новых
  # соединениях по нему к сетям владельца (клиенты сразу уходят на другой протокол) или обход через другой
  # путь; DNS-сервер не трогается; весь протокол — общий режим, если и свидетели видят плохим весь протокол)
  mode: "off"
  # Где переключать: auto — SmartDNS, если он обслуживает DNS и его custom.conf включает upstream_file и
  # guard_file (тогда блокировка рекламы остаётся и при DNS64), иначе dnsmasq | smartdns | dnsmasq.
  backend: auto
  # IPv6 плохой (диагноз IPV6_DEGRADATION) дольше, с — запрет AAAA.
  v6_enter_sec: 300
  # IPv4 сломан (WARNING/CRITICAL, IPv6 жив) дольше, с — DNS64.
  v4_enter_sec: 60
  # Всё в норме дольше, с — DNS как было.
  recover_sec: 600
  # Серверы DNS64 (только IP; по умолчанию — публичный nat64.net).
  dns64_servers: [2001:67c:2960::64, 2001:67c:2960::6464]
  # Для smartdns — файл вышестоящих серверов (его включает custom.conf строкой conf-file).
  upstream_file: /etc/smartdns/upstream.conf
  # Для smartdns — файл запрета AAAA (тоже через conf-file в custom.conf).
  guard_file: /etc/smartdns/cgmon-dnsguard.conf
  # Для smartdns — кэш на диске, удаляется при переключении.
  cache_file: /etc/smartdns/smartdns.cache
  # Снимок обычных настроек DNS (обновляется при ваших правках) и аварийного режима.
  state_file: /etc/cgmon/dnsguard.json
  # Вместе с запретом AAAA снимать IPv6-шлюз (перестать объявлять клиентам IPv6-маршрут) (odhcpd ra_lifetime=0 в секциях
  # dhcp с ra=server; по возврату — как было): иначе устройства со своим DoH (Android «Частный DNS»,
  # Chrome) продолжают ходить по плохому IPv6 мимо DNS роутера.
  withdraw_ra: false
  # Только для check_via: proto (сайты «мой IP» лишь по IPv6): файл для SmartDNS (address /домен/#4),
  # включается в custom.conf строкой conf-file. Штрафы и обход в него не пишутся (с 2.3.44).
  targets_file: /etc/smartdns/cgmon-dnsguard-targets.conf
  # Адресный режим: первый штраф сети, мин; каждый следующий вдвое дольше (перед снятием — проверка,
  # всё ещё плохо — следующая ступень); сутки без сбоев — ступень вниз.
  target_base_min: 60
  # Адресный режим: самый долгий штраф, ч.
  target_max_hours: 24
  # Адресный режим: куда уводить сеть с плохим протоколом, по порядку (первая годная): proto — другой
  # протокол через DNS; устройство (eth3, tailscale0) — новые IPv4-соединения к сетям владельца через
  # этот путь, если путь жив и владелец через него отвечает. Порядок удобнее менять на странице.
  alternatives: [proto]
  # Адресный режим: лимитированные пути (мобильный интернет) — трафик обхода через них считается.
  metered: []
  # Адресный режим: суточный лимит лимитированного пути, МБ; исчерпан — путь не используется до полуночи.
  metered_day_mb: 5000
  # Адресный режим: сайты «мой IP» всегда идут (IPv4) через первый рабочий путь обхода — открыть в
  # браузере и увидеть, откуда смотрит интернет; IPv6 они покажут прямой (обход только IPv4).
  check_domains: [ipleak.net, test-ipv6.com]
  # Через что пускать сайты проверки: "" — первый рабочий путь обхода, direct — напрямую, proto — только
  # по IPv6 (им не отдаются A), устройство (eth3, tailscale0) — через этот путь.
  check_via: ""
  # Ретрансляторы — свои узлы как пути обхода, без exit node и шлюзов по умолчанию: «имя@адрес»
  # узла в соседней сети (ZeroTier, LAN), напр. node1@10.147.17.5. Путь называется @имя, его ставят
  # в alternatives (конструктор на странице). На узле нужны пересылка из этой сети в его WAN и NAT.
  relays: []
  # Ограничение скорости пути через ретранслятор в каждую сторону, Мбит/с (0 — без ограничения).
  relay_mbit: 50
  # Устарело с 2.3.43, не действует: в адресном режиме перевод на другой протокол — всегда отказ
  # в новых соединениях к сетям владельца (TCP RST, ICMP), SmartDNS не трогается.
  reject_v6: false
  # Пробы IPv6 (и метрики по сайтам, если включены) ниже, % — отказ ВСЕМ новым IPv6-соединениям клиентов
  # в интернет (локальный IPv6 и туннели не трогаются); 0 — никогда. Только для совсем плохого IPv6.
  reject_all_v6_score: 20
  # ...дольше, с; снимается, когда пробы выше порога+20 пять минут.
  reject_all_v6_sec: 300

# ==== Свидетели: оценка IPv4/IPv6 баллами (пока только наблюдение) ====
witness:
  # Узлы, с которыми у клиентов были удачные соединения tcp/443, роутер раз в interval_sec проверяет
  # сам; надёжность узла учится, балл протокола — взвешенная доля ответивших (+ за вернувшихся).
  # Расхождение с обычным диагнозом дольше 5 мин — в журнал. off | observe
  mode: "off"
  # Свидетелей на протокол (до 32; не больше одного на сеть /24 или /48).
  per_family: 12
  # Проверка всех свидетелей раз в, с.
  interval_sec: 60
  # Свидетели и их надёжность (переживают перезапуск).
  state_file: /etc/cgmon/witness.json

# ==== Напоминание об оплате интернета (через центр сбора, Telegram) ====
payment:
  # Напоминать. Нужны report (отчёты на центр) и Telegram на центре; иначе — только журнал и страница.
  enabled: false
  # monthly — каждый месяц в день day; interval — каждые interval_days дней от start_date.
  mode: monthly
  # Число месяца (в коротком месяце — последний день).
  day: 1
  # Через сколько дней платить (для mode interval; бывают провайдеры с 30 днями).
  interval_days: 30
  # Дата любой оплаты для mode interval, ГГГГ-ММ-ДД (от неё считаются интервалы).
  start_date: ""
  # Сумма оплаты (текст, показывается в напоминании).
  amount: ""
  # Пометка: лицевой счёт, тариф (текст).
  note: ""
  # Напомнить за столько дней до срока (и ещё раз в день оплаты).
  remind_days: 3
  # Не раньше этого часа.
  remind_hour: 10
  # Какие напоминания уже записаны в журнал роутера.
  state_file: /etc/cgmon/payment.json

# ==== Отчёты на центр мониторинга ====
report:
  # Отправлять данные на центр мониторинга (hub на другом роутере).
  enabled: false
  # Центры сбора (можно несколько — данные уходят во все). Отчёты шифруются (AES-256-GCM),
  # поэтому достаточно http://. Пример: [http://10.0.0.1:7788/api/v1/report, http://203.0.113.10:7788/api/v1/report]
  urls: []
  # Общий секрет с центром (как hub.token), не короче 16 символов. Генерация: head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n'
  token: ""
  # Отчёт не реже, с (при изменениях — сразу).
  interval_sec: 60
  # Имя роутера для центра (пусто — имя хоста).
  name: ""

# ==== Центр мониторинга (на одном роутере) ====
hub:
  # Центр мониторинга на этом роутере: принимает отчёты, сопоставляет сбои, шлёт в Telegram.
  enabled: false
  # Адрес:порт центра. Открыть в firewall: TCP 7788 (только TCP, только этот порт).
  listen: ":7788"
  # Секрет для отчётов роутеров (≥16 символов, тот же, что report.token у роутеров).
  token: ""
  # (старый формат) один бот: токен от @BotFather. Новый — список telegram ниже.
  telegram_bot_token: ""
  # ID чата/группы для уведомлений.
  telegram_chat_id: ""
  # Боты и получатели (можно несколько ботов, у каждого несколько чатов) — каждое
  # уведомление уходит всем. Только в cgmon.yaml. Пример:
  #   - bot_token: "123456:ABC…"
  #     chat_ids: ["123456789", "-1001234567890", "@channel"]
  telegram: []
  # Без отчётов дольше — роутер «не на связи», с.
  stale_sec: 180
  # Общий сбой — деградация у роутеров стольких разных провайдеров.
  min_isps: 2
  # Сбой закрыт, если не повторялся столько, с.
  clear_sec: 60
  # Слать и сбои отдельного роутера.
  notify_single: false
  # Слать «роутер не на связи / снова на связи».
  notify_offline: true
  # Состояние центра (роутеры, открытые сбои).
  state_file: /etc/cgmon/hub_state.json
  # Общий журнал всех роутеров (JSONL).
  journal_file: /tmp/cgmon/hub.jsonl

# ==== Платный трафик (всё, кроме бесплатных сетей) ====
billing:
  # Счётчик платного трафика (всё, кроме бесплатных сетей провайдера) включён
  # по умолчанию; включается и выключается и галочкой на странице.
  enabled: false
  # Список бесплатных сетей: ссылка http(s) на текст (по сети на строку,
  # IPv4/IPv6, # — комментарий) или file — только свой файл, загруженный со
  # страницы (не скачивается). По умолчанию — TAS-IX (Узбекистан).
  tasix_url: "https://tasix.dc.uz/subnets.txt"
  # Где лежит список (скачанный или загруженный).
  tasix_file: /etc/cgmon/tasix.txt
  # Обновлять список раз в столько часов.
  refresh_hours: 24
  # Предупреждение при платном трафике за сутки больше, МБ (0 — нет).
  daily_limit_mb: 0
  # … за расчётный месяц, МБ.
  monthly_limit_mb: 0
  # День начала расчётного месяца.
  month_start_day: 1
  # Счётчики по дням/месяцам.
  state_file: /etc/cgmon/billing.json

# ==== SQM: умная очередь канала ====
qos:
  # SQM: умная очередь канала (cake/HTB) вместо sqm-scripts.
  enabled: false
  # Устройство WAN для очереди: auto — устройство маршрута по умолчанию (PPPoE, DHCP,
  # резервный канал; при смене WAN очередь переезжает сама) или явно, напр. pppoe-wan, wan
  device: auto
  # IFB для приёма (пусто — ifb4<устройство>).
  ifb: ""
  # Скорость канала на отдачу, кбит/с (чуть ниже тарифа; 0 — не шейпить).
  upload_kbit: 0
  # Скорость на приём, кбит/с.
  download_kbit: 0
  # Лимит отдачи на соединение, кбит/с (0 — без лимита).
  flow_cap_up_kbit: 0
  # Ключи потока для лимита отдачи (tc flow). Пример: nfct-src — на устройство.
  flow_keys_up: "src,dst,proto,proto-src,proto-dst"
  # Лимит загрузки на соединение, кбит/с (0 — без лимита).
  flow_cap_down_kbit: 0
  # Ключи потока для лимита загрузки.
  flow_keys_down: "src,dst,proto,proto-src,proto-dst"
  # Число корзин потоков.
  flow_buckets: 128
  # Параметры cake на отдаче.
  cake_opts: besteffort nat raw
  # Параметры cake на приёме.
  ingress_cake_opts: besteffort nat wash raw

# ==== Страница status.html ====
web:
  # Пароль на изменение настроек со страницы. Пусто — страница только показывает, менять
  # с неё ничего нельзя. Задаётся здесь, мастером (cgmon --install) или в LuCI → Службы → cgmon.
  password: ""
  # Страница (status.html) и её CGI встроены в cgmon сжатыми: при запуске распаковываются
  # в /tmp/cgmon/www, а в /www ставятся символьные ссылки. На flash — ни одного лишнего
  # файла (полезно роутерам с 2–8 МБ), страница всегда той же версии, что и cgmon.
  # false — /www не трогать (страницу кладёте сами).
  embedded: true

# ==== Имена устройств ====
devices:
  # Узнавать имена устройств: обратный DNS, mDNS, NetBIOS, прослушивание mDNS/SSDP.
  probe: true
  # Производитель по MAC (онлайн, с кэшем).
  vendor_lookup: true
  # Сервис производителей по MAC.
  vendor_url: "https://api.macvendors.com/"
  # Кэш производителей.
  vendor_cache: /etc/cgmon/oui_cache.json
  # Ловец устройств (как IP Scan в MikroTik): слушать ARP/NDP на LAN и показывать
  # устройства с адресом не из своей подсети (старая камера со статическим IP).
  l2_watch: false
  # Раз в 10 минут будить молчащие устройства: ARP-обход своих подсетей (до /22),
  # ping на broadcast, ONVIF, SSDP, SADP.
  l2_probe: true
# Контроль WAN: active — пробы (рекомендуется); hybrid — по трафику + проба раз в 30 с; passive — только трафик (эксперимент).
wan_check: active
